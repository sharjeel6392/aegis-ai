name: aegis

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis}
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_PASSWORD:-aegis}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: infra/Dockerfile
    env_file:
      - .env
    ports:
      - "${AEGIS_PORT:-8000}:8000"
    volumes:
      # Hot reload: source is mounted, the installed venv at /opt/venv is not shadowed
      - ./src:/app/src
      - ./tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Day 1 placeholder: proves the image builds and the package imports, then idles
    # so the stack stays up. Day 2 replaces this with uvicorn --reload.
    command:
      - sh
      - -c
      - "python -c \"import aegis; print('aegis ' + aegis.__version__ + ' scaffold OK', flush=True)\" && sleep infinity"
  
volumes:
  postgres-data:
  redis-data: